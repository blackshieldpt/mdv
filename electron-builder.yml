appId: pt.blackshield.mdv
productName: mdv
directories:
  output: dist
files:
  - out/**/*
# One extension per entry: the Linux packages turn an entry's extensions into a single glob.
fileAssociations:
  - ext: md
    name: Markdown
    role: Viewer
    mimeType: text/markdown
  - ext: markdown
    name: Markdown
    role: Viewer
    mimeType: text/markdown
  - ext: mdown
    name: Markdown
    role: Viewer
    mimeType: text/markdown
  - ext: mkd
    name: Markdown
    role: Viewer
    mimeType: text/markdown
  - ext: mdx
    name: MDX
    role: Viewer
    mimeType: text/mdx
linux:
  target: [deb, snap]
  category: Office
  syncDesktopName: true
  icon: build/icons
  # Not top level: on macOS these would land loose in Contents/ and break the signature.
  extraFiles:
    - from: LICENSE
      to: LICENSE.mdv.txt
    - from: out/renderer/THIRD-PARTY-NOTICES.txt
      to: THIRD-PARTY-NOTICES.txt
# Built by snapcraft in an LXD container.
snapcraft:
  base: core24
  core24:
    summary: Markdown viewer
    useLXD: true
    plugs:
      # Documents are read from the home folder; images may come from the web.
      - home
      - network
      # Lets Chromium's own sandbox run inside the snap's confinement.
      - browser-support:
          interface: browser-support
          allow-sandbox: true
win:
  target: nsis
  extraFiles:
    - from: LICENSE
      to: LICENSE.mdv.txt
    - from: out/renderer/THIRD-PARTY-NOTICES.txt
      to: THIRD-PARTY-NOTICES.txt
mac:
  target: dmg
  # electron-builder leaves this file out of macOS bundles.
  extraResources:
    - from: node_modules/electron/dist/LICENSES.chromium.html
      to: LICENSES.chromium.html
    - from: LICENSE
      to: LICENSE.mdv.txt
    - from: out/renderer/THIRD-PARTY-NOTICES.txt
      to: THIRD-PARTY-NOTICES.txt
  category: public.app-category.productivity
  # Ad-hoc signed: not notarized, but the bundle's signature is valid. The hardened runtime is only
  # needed for notarization.
  identity: '-'
  hardenedRuntime: false
